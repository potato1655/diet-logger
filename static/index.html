<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#141414" />
  <title>Diet Logger</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<!-- Auth overlay -->
<div id="auth-overlay" class="hidden">
  <div class="auth-card">
    <div class="auth-icon"><i data-lucide="salad" style="width:64px;height:64px;"></i></div>
    <h1>Diet Logger</h1>
    <p>Sign in with Google to log your meals to Google Health</p>
    <button class="btn-google" onclick="signIn()">Sign in with Google</button>
  </div>
</div>

<!-- Main app -->
<div id="app" class="hidden">

  <!-- Header -->
  <header>
    <span class="logo" style="display:flex;align-items:center;gap:6px;"><i data-lucide="salad" style="width:20px;height:20px;color:var(--accent)"></i> Diet Logger</span>
    <button class="btn-logout" onclick="signOut()" title="Sign out"><i data-lucide="log-out" style="width:16px;height:16px;"></i></button>
  </header>

  <!-- Content area -->
  <main>

    <!-- ── HOME TAB (NEW) ── -->
    <section id="tab-home" class="tab-content active">
      <div id="daily-dashboard"></div>
    </section>

    <!-- ── LOG TAB ── -->
    <section id="tab-log" class="tab-content">

      <!-- Upload area -->
      <div class="upload-area">
        <div id="preview-container">
          <div class="upload-placeholder">
            <span class="upload-icon"><i data-lucide="image-plus" style="width:40px;height:40px;color:var(--accent)"></i></span>
            <p>Add a food photo</p>
            <div class="upload-buttons">
              <button type="button" class="btn-secondary" style="display:flex;align-items:center;gap:4px;" onclick="event.stopPropagation(); document.getElementById('camera-input').click()"><i data-lucide="camera" style="width:14px;height:14px;"></i> Camera</button>
              <button type="button" class="btn-secondary" style="display:flex;align-items:center;gap:4px;" onclick="event.stopPropagation(); document.getElementById('gallery-input').click()"><i data-lucide="image" style="width:14px;height:14px;"></i> Gallery</button>
            </div>
          </div>
        </div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)" />
        <input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleImage(event)" />
      </div>

      <!-- Context text -->
      <div class="form-group">
        <input type="text" id="extra-text" placeholder="Anything to add? (e.g. extra ghee, large portion)" />
      </div>

      <!-- Meal type -->
      <div class="meal-selector">
        <button class="meal-btn" data-meal="Breakfast" onclick="selectMeal(this)">🌅 Breakfast</button>
        <button class="meal-btn active" data-meal="Lunch" onclick="selectMeal(this)">🍽️ Lunch</button>
        <button class="meal-btn" data-meal="Dinner" onclick="selectMeal(this)">🌙 Dinner</button>
        <button class="meal-btn" data-meal="Snack" onclick="selectMeal(this)">🍎 Snack</button>
      </div>

      <!-- Meal time -->
      <div class="form-group time-group">
        <label for="meal-time">Meal Time</label>
        <input type="time" id="meal-time">
      </div>

      <!-- Analyze button -->
      <button id="analyze-btn" class="btn-analyze hidden" style="display:none" onclick="analyzeFood()">
        <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
          <i data-lucide="sparkles" style="width:16px;height:16px;"></i> Analyze Food
        </div>
      </button>

      <!-- Spinner -->
      <div id="spinner" class="hidden">
        <div class="spinner"></div>
        <p>Analyzing your food...</p>
      </div>

      <!-- AI Questions -->
      <div id="ai-questions-container" class="hidden ai-questions-card">
        <h3 style="display:flex;align-items:center;gap:6px;"><i data-lucide="message-square-text" style="width:18px;height:18px;color:var(--accent);"></i> Questions</h3>
        <ul id="ai-questions-list"></ul>
      </div>

      <!-- Food items -->
      <div id="food-results" class="hidden">
        <div class="section-header">
          <h2>Detected Foods</h2>
          <button class="btn-add" onclick="addFoodManually()">+ Add</button>
        </div>
        <div id="food-list"></div>
        <div class="totals-card" id="totals-card"></div>
        <button id="log-btn" class="btn-log" onclick="logFood(this)">
          <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
            <i data-lucide="check" style="width:18px;height:18px;"></i> Log Meal
          </div>
        </button>
      </div>

      <!-- Success message -->
      <div id="success-msg" class="success-msg hidden">
        <div style="display:flex;align-items:center;gap:8px;">
          <i data-lucide="check-circle-2" style="width:20px;height:20px;"></i>
          <span></span>
        </div>
        <button class="btn-secondary" onclick="resetLog()">Log Another</button>
      </div>

    </section>

    <!-- ── HISTORY TAB ── -->
    <section id="tab-history" class="tab-content">
      <div class="history-header">
        <h2>Recent Meals</h2>
        <p class="text-muted">Last 7 days</p>
      </div>
      <div id="history-list"></div>
    </section>

  </main>

  <!-- Navigation -->
  <nav class="bottom-nav frosted">
    <button class="nav-btn active" onclick="switchTab('home', this)">
      <i data-lucide="home" style="width:24px;height:24px;"></i>
      <span>Home</span>
    </button>
    <button class="nav-btn" onclick="switchTab('log', this)">
      <i data-lucide="pen-line" style="width:24px;height:24px;"></i>
      <span>Log</span>
    </button>
    <button class="nav-btn" onclick="switchTab('history', this)">
      <i data-lucide="clock" style="width:24px;height:24px;"></i>
      <span>History</span>
    </button>
  </nav>

</div>

<script src="/app.js?v=17"></script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // New update available, force reload
              window.location.reload();
            }
          });
        });
      });
      
      let refreshing;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
    lucide.createIcons();
  </script>
  <!-- Toast Container -->
  <div id="toast-container" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;z-index:9999;width:90%;max-width:400px;pointer-events:none;"></div>
</body>
</html>
