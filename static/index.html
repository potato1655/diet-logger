<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16a34a" />
  <title>Diet Logger</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
</head>
<body>

<!-- Auth overlay -->
<div id="auth-overlay" class="hidden">
  <div class="auth-card">
    <div class="auth-icon">🥗</div>
    <h1>Diet Logger</h1>
    <p>Sign in with Google to log your meals to Google Health</p>
    <button class="btn-google" onclick="signIn()">Sign in with Google</button>
  </div>
</div>

<!-- Main app -->
<div id="app" class="hidden">

  <!-- Header -->
  <header>
    <span class="logo">🥗 Diet Logger</span>
    <button class="btn-logout" onclick="signOut()" title="Sign out">⏻</button>
  </header>

  <!-- Content area -->
  <main>

    <!-- ── LOG TAB ── -->
    <section id="tab-log" class="tab-content active">

      <!-- Upload area -->
      <div class="upload-area">
        <div id="preview-container">
          <div class="upload-placeholder">
            <span class="upload-icon">🥗</span>
            <p>Add a food photo</p>
            <div class="upload-buttons">
              <button type="button" class="btn-secondary" onclick="event.stopPropagation(); document.getElementById('camera-input').click()">📷 Camera</button>
              <button type="button" class="btn-secondary" onclick="event.stopPropagation(); document.getElementById('gallery-input').click()">🖼️ Gallery</button>
            </div>
          </div>
        </div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)" />
        <input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleImage(event)" />
      </div>

      <!-- Context text -->
      <div class="form-group">
        <input type="text" id="extra-text" placeholder="Anything to add? (e.g. extra ghee, large portion)" />
      </div>

      <!-- Meal type -->
      <div class="meal-selector">
        <button class="meal-btn" data-meal="Breakfast" onclick="selectMeal(this)">🌅 Breakfast</button>
        <button class="meal-btn active" data-meal="Lunch" onclick="selectMeal(this)">☀️ Lunch</button>
        <button class="meal-btn" data-meal="Dinner" onclick="selectMeal(this)">🌙 Dinner</button>
        <button class="meal-btn" data-meal="Snack" onclick="selectMeal(this)">🍎 Snack</button>
      </div>

      <!-- Analyze button -->
      <button id="analyze-btn" class="btn-analyze hidden" onclick="analyzeFood()">🔍 Analyze Food</button>

      <!-- Spinner -->
      <div id="spinner" class="hidden">
        <div class="spinner"></div>
        <p>Analyzing your food...</p>
      </div>

      <!-- AI Questions -->
      <div id="ai-questions-container" class="hidden ai-questions-card">
        <h3>🤔 AI Questions</h3>
        <ul id="ai-questions-list"></ul>
        <p>(Answer these in the top box and hit Re-Analyze)</p>
      </div>

      <!-- Food items -->
      <div id="food-results" class="hidden">
        <div class="section-header">
          <h2>Detected Foods</h2>
          <button class="btn-add" onclick="addFoodManually()">+ Add</button>
        </div>
        <div id="food-list"></div>
        <div class="totals-card" id="totals-card"></div>
        <button id="log-btn" class="btn-log" onclick="logMeal()">✅ Log Meal</button>
      </div>

      <!-- Success message -->
      <div id="success-msg" class="success-msg hidden">
        <span>✅ Meal logged to Google Health!</span>
        <button onclick="resetLog()">Log another</button>
      </div>

    </section>

    <!-- ── HISTORY TAB ── -->
    <section id="tab-history" class="tab-content">
      <h2 class="history-title">Past Meals</h2>
      <div id="history-list"><p class="empty-msg">No meals logged yet.</p></div>
    </section>

  </main>

  <!-- Bottom tab bar -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('log', this)">
      <span>📷</span><small>Log</small>
    </button>
    <button class="tab-btn" onclick="switchTab('history', this)">
      <span>📋</span><small>History</small>
    </button>
  </nav>

</div>

<script src="/app.js?v=8"></script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // New update available, force reload
              window.location.reload();
            }
          });
        });
      });
      
      let refreshing;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
