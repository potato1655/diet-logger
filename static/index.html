<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1a19" />
  <title>Diet Logger</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<!-- Auth overlay -->
<div id="auth-overlay" class="hidden">
  <div class="auth-card">
    <div class="auth-icon"><img src="/icon-192.png" alt="Logo" style="width:72px;height:72px;" /></div>
    <h1>Diet Logger</h1>
    <p>Snap a photo, get instant nutrition data, and log it straight to Google Health.</p>
    <button class="btn-google" onclick="signIn()">
      <i data-lucide="log-in" style="width:18px;height:18px;"></i>
      Sign in with Google
    </button>
  </div>
</div>

<!-- Main app -->
<div id="app" class="hidden">
  <!-- Header -->
  <header>
    <span class="logo" style="display:flex;align-items:center;gap:8px;">
      <img src="/icon-192.png" alt="Logo" style="width:24px;height:24px;" />
      Diet Logger
    </span>
    <button class="btn-logout" onclick="signOut()" title="Sign out">
      <i data-lucide="log-out" style="width:16px;height:16px;"></i>
    </button>
  </header>

  <!-- Content area -->
  <main>

    <!-- ── LOG TAB ── -->
    <section id="tab-log" class="tab-content active">

      <!-- Upload area -->
      <div class="upload-area" id="upload-area">
        <div id="preview-container">
          <div class="upload-placeholder">
            <span class="upload-icon"><i data-lucide="camera" style="width:40px;height:40px;color:var(--accent)"></i></span>
            <p style="font-weight:600;margin-bottom:4px;">Snap your meal</p>
            <p style="font-size:0.82rem;color:var(--text-dim);">Take a photo or choose from gallery</p>
            <div class="upload-buttons">
              <button type="button" class="btn-secondary" style="display:flex;align-items:center;gap:5px;" onclick="event.stopPropagation(); document.getElementById('camera-input').click()">
                <i data-lucide="camera" style="width:14px;height:14px;"></i> Camera
              </button>
              <button type="button" class="btn-secondary" style="display:flex;align-items:center;gap:5px;" onclick="event.stopPropagation(); document.getElementById('gallery-input').click()">
                <i data-lucide="image" style="width:14px;height:14px;"></i> Gallery
              </button>
            </div>
          </div>
        </div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)" />
        <input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleImage(event)" />
      </div>

      <!-- Context text -->
      <div class="form-group">
        <input type="text" id="extra-text" placeholder="Add context... (e.g. 'extra ghee, large portion')" />
      </div>

      <!-- Meal type -->
      <div class="meal-selector">
        <button class="meal-btn" data-meal="Breakfast" onclick="selectMeal(this)">☀️ Breakfast</button>
        <button class="meal-btn active" data-meal="Lunch" onclick="selectMeal(this)">🍽️ Lunch</button>
        <button class="meal-btn" data-meal="Dinner" onclick="selectMeal(this)">🌙 Dinner</button>
        <button class="meal-btn" data-meal="Snack" onclick="selectMeal(this)">🍎 Snack</button>
      </div>

      <!-- Meal date/time -->
      <div style="display:flex; gap:0.75rem; margin-bottom: 1.5rem;">
        <div class="form-group time-group" style="flex:1; margin-bottom:0;">
          <label for="meal-date">
            <i data-lucide="calendar" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--text-dim)"></i>
            Date
          </label>
          <input type="date" id="meal-date">
        </div>
        <div class="form-group time-group" style="flex:1; margin-bottom:0;">
          <label for="meal-time">
            <i data-lucide="clock" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--text-dim)"></i>
            Time
          </label>
          <input type="time" id="meal-time">
        </div>
      </div>

      <!-- Analyze button -->
      <button id="analyze-btn" class="btn-analyze hidden" onclick="analyzeFood()">
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
          <i data-lucide="sparkles" style="width:18px;height:18px;"></i> Analyze Food
        </div>
      </button>

      <!-- Spinner -->
      <div id="spinner" class="hidden">
        <div class="spinner"></div>
        <p>Analyzing your food...</p>
        <div style="margin-top:1rem;">
          <div class="skeleton-card"></div>
          <div class="skeleton-card" style="width:85%;"></div>
          <div class="skeleton-card" style="width:70%;"></div>
        </div>
      </div>

      <!-- AI Questions -->
      <div id="ai-questions-container" class="hidden ai-questions-card">
        <h3 style="display:flex;align-items:center;gap:6px;">
          <i data-lucide="message-square-text" style="width:18px;height:18px;color:var(--accent);"></i> Quick Questions
        </h3>
        <ul id="ai-questions-list"></ul>
      </div>

      <!-- Food items -->
      <div id="food-results" class="hidden">
        <div class="section-header">
          <h2>Detected Foods</h2>
          <button class="btn-add" onclick="addFoodManually()">
            <span style="display:flex;align-items:center;gap:4px;"><i data-lucide="plus" style="width:12px;height:12px;"></i> Add</span>
          </button>
        </div>
        <div id="food-list" class="stagger"></div>
        <div class="totals-card" id="totals-card"></div>
        <button id="log-btn" class="btn-log" onclick="logMeal(this)">
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
            <i data-lucide="send" style="width:18px;height:18px;"></i> Log to Google Health
          </div>
        </button>
      </div>

      <!-- Success message -->
      <div id="success-msg" class="success-msg hidden">
        <div class="success-icon" style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.1rem;">
          <i data-lucide="check-circle-2" style="width:24px;height:24px;"></i>
          <span></span>
        </div>
        <button onclick="resetLog()">Log Another Meal</button>
      </div>

    </section>

    <!-- ── HISTORY TAB ── -->
    <section id="tab-history" class="tab-content">
      <div style="margin-bottom:1rem;">
        <h2 style="font-size:1.2rem;font-weight:800;letter-spacing:-0.02em;">Recent Meals</h2>
        <p style="color:var(--text-dim);font-size:0.82rem;margin-top:2px;">Pulled from Google Fit · Last 7 days</p>
      </div>
      <div id="history-list"></div>
    </section>

  </main>

  <!-- Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('log', this)">
      <div class="nav-btn-inner">
        <i data-lucide="plus-circle"></i>
        <span>Log</span>
      </div>
    </button>
    <button class="nav-btn" onclick="switchTab('history', this)">
      <div class="nav-btn-inner">
        <i data-lucide="history"></i>
        <span>History</span>
      </div>
    </button>
  </nav>

</div>

<script src="/app.js?v=21"></script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.location.reload();
            }
          });
        });
      });
      
      let refreshing;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
    lucide.createIcons();
  </script>
  <!-- Toast Container -->
  <div id="toast-container" style="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;z-index:9999;width:90%;max-width:400px;pointer-events:none;"></div>
</body>
</html>
